<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>경찰대학 졸업학점 계산기🏫 </title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --soft:#F4F6F9; --ink:#12213C; --ink2:#4A586F; --line:#D3DAE5;
  --accent:#1F4FA8; --accent-ink:#FFFFFF;
  --ok:#17785A; --okbg:#E1F2EB; --prog:#9A5E08; --progbg:#FBEFD9; --miss:#B23A2E; --missbg:#F8E4E1;
  --bar-miss:#D9DFE9;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1526; --surface:#162139; --soft:#1B2945; --ink:#E7EDF8; --ink2:#A3B2CC; --line:#2C3A58;
    --accent:#7BA5FF; --accent-ink:#0B1530;
    --ok:#4FD1A1; --okbg:#133A2F; --prog:#F0B554; --progbg:#41320F; --miss:#FF8F80; --missbg:#4A1F1B;
    --bar-miss:#2C3A58; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1526; --surface:#162139; --soft:#1B2945; --ink:#E7EDF8; --ink2:#A3B2CC; --line:#2C3A58;
  --accent:#7BA5FF; --accent-ink:#0B1530;
  --ok:#4FD1A1; --okbg:#133A2F; --prog:#F0B554; --progbg:#41320F; --miss:#FF8F80; --missbg:#4A1F1B;
  --bar-miss:#2C3A58; color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px);}
*,*::before,*::after{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  font-size:15px; line-height:1.55; -webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30;}
.num{font-variant-numeric:tabular-nums;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 56px;}

/* sticky bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);}
.bar-in{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.bar .t{font-weight:600;font-size:14px;color:var(--ink2);}
.bar .big{font-size:26px;font-weight:700;line-height:1;letter-spacing:-0.01em;}
.bar .big small{font-size:14px;font-weight:500;margin-left:2px;color:var(--ink2);}
.bar .mini{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--ink2);}
.bar .mini b{color:var(--ink);font-weight:600;}
.bar .sp{flex:1;}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);cursor:pointer;user-select:none;}
.chk input{width:18px;height:18px;accent-color:var(--accent);}

header.top{padding:26px 0 8px;}
header.top h1{margin:0;font-size:24px;line-height:1.25;letter-spacing:-0.02em;}
header.top p{margin:6px 0 0;color:var(--ink2);font-size:14px;max-width:62ch;}
header.top .by{margin-top:8px;font-size:13px;color:var(--ink2);}
header.top .by b{color:var(--ink);font-weight:600;}

/* ledger */
.ledger{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:14px;}
.warn{background:var(--progbg);color:var(--prog);border-radius:8px;padding:9px 12px;font-size:13.5px;margin-bottom:14px;font-weight:500;}
.lg-top{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:14px;}
.lg-top .n{font-size:56px;font-weight:700;line-height:1;letter-spacing:-0.03em;}
.lg-top .n small{font-size:18px;font-weight:500;color:var(--ink2);margin-left:4px;letter-spacing:0;}
.lg-top .d{color:var(--ink2);font-size:14px;padding-bottom:4px;}
.lg-top .d b{color:var(--ink);}
.lrow{display:grid;grid-template-columns:104px 1fr 150px;gap:6px 14px;align-items:center;padding:9px 0;border-top:1px solid var(--line);}
.lrow .nm{font-weight:600;}
.lrow .nm small{display:block;font-weight:400;color:var(--ink2);font-size:12px;}
.track{height:12px;border-radius:6px;background:var(--bar-miss);display:flex;overflow:hidden;}
.track i{display:block;height:100%;}
.track .d{background:var(--ok);} .track .p{background:var(--prog);}
.lrow .rt{text-align:right;font-size:13px;color:var(--ink2);}
.lrow .rt b{font-size:17px;color:var(--ink);font-weight:700;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:10px;}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--bar-miss);}
.legend .ld::before{background:var(--ok);} .legend .lp::before{background:var(--prog);}

.plan{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;}
.plan input{width:62px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);}
.plan .res{color:var(--ink2);}
.plan .res b{color:var(--ink);}
.plan .res.bad b{color:var(--miss);}

/* tabs */
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin:18px 0 12px;border-bottom:1px solid var(--line);scrollbar-width:thin;}
nav.tabs button{flex:0 0 auto;border:0;background:none;padding:10px 14px;font-weight:600;font-size:14.5px;color:var(--ink2);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);}
nav.tabs .cnt{display:inline-block;margin-left:6px;font-size:12px;font-weight:600;padding:1px 7px;border-radius:9px;background:var(--missbg);color:var(--miss);}
nav.tabs .cnt.z{background:var(--okbg);color:var(--ok);}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px;}
.card h2{margin:0 0 4px;font-size:17px;letter-spacing:-0.01em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.card h2 .tg{font-size:13px;font-weight:500;color:var(--ink2);}
.card h3{margin:16px 0 4px;font-size:14.5px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;}
.card h3 .need{font-size:12.5px;font-weight:500;color:var(--ink2);}
.note{font-size:13px;color:var(--ink2);margin:4px 0 8px;max-width:78ch;}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--soft);color:var(--ink2);}
.pill.ok{background:var(--okbg);color:var(--ok);} .pill.no{background:var(--missbg);color:var(--miss);} .pill.pg{background:var(--progbg);color:var(--prog);}

/* course row */
.crs{display:grid;grid-template-columns:1fr 54px auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);}
.crs .nm{font-size:14.5px;}
.crs .cr{font-size:13px;color:var(--ink2);text-align:right;}
.crs.s1 .nm{color:var(--ok);font-weight:600;}
.crs.s2 .nm{color:var(--prog);font-weight:600;}
.tag{display:inline-block;margin-left:6px;font-size:11px;font-weight:600;padding:0 6px;border-radius:4px;background:var(--soft);color:var(--ink2);vertical-align:1px;}
.tag.R{background:#E4ECFB;color:#27498F;} .tag.H{background:#EFE6F8;color:#5B3A87;} .tag.G{background:#F9E6EF;color:#8F2B5C;}
.tag.new{background:var(--progbg);color:var(--prog);}
:root[data-theme="dark"] .tag.R{background:#22365E;color:#B7CDFF;}
:root[data-theme="dark"] .tag.H{background:#3A2C55;color:#D9C6F5;}
:root[data-theme="dark"] .tag.G{background:#55283F;color:#F5C5DB;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .tag.R{background:#22365E;color:#B7CDFF;}
  :root:not([data-theme="light"]) .tag.H{background:#3A2C55;color:#D9C6F5;}
  :root:not([data-theme="light"]) .tag.G{background:#55283F;color:#F5C5DB;}
}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.seg button{border:0;background:var(--surface);padding:5px 10px;font-size:13px;color:var(--ink2);border-left:1px solid var(--line);min-width:52px;}
.seg button:first-child{border-left:0;}
.seg button[aria-pressed="true"][data-v="1"]{background:var(--ok);color:#fff;}
.seg button[aria-pressed="true"][data-v="2"]{background:var(--prog);color:#fff;}
.seg button[aria-pressed="true"][data-v="0"]{background:var(--soft);color:var(--ink);font-weight:600;}
:root[data-theme="dark"] .seg button[aria-pressed="true"][data-v="1"],:root[data-theme="dark"] .seg button[aria-pressed="true"][data-v="2"]{color:#0B1530;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"][data-v="1"],:root:not([data-theme="light"]) .seg button[aria-pressed="true"][data-v="2"]{color:#0B1530;}}
.pickbox{border:1px dashed var(--line);border-radius:8px;padding:2px 10px;margin:6px 0;}
.pickbox .lab{font-size:12.5px;color:var(--ink2);margin-top:6px;}

details.grp{border-top:1px solid var(--line);margin-top:10px;padding-top:8px;}
details.grp>summary{cursor:pointer;font-weight:600;font-size:14.5px;list-style:none;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:4px 0;}
details.grp>summary::-webkit-details-marker{display:none;}
details.grp>summary::before{content:"▸";color:var(--ink2);font-size:12px;width:12px;}
details.grp[open]>summary::before{content:"▾";}

.stp{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;}
.stp .lb{min-width:120px;font-size:14.5px;}
.stp button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1;}
.stp .v{min-width:28px;text-align:center;font-weight:700;}

.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:8px;}
.fm label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2);}
.fm input,.fm select,.inp{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:14.5px;color:var(--ink);}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:8px;font-weight:600;font-size:14px;}
.btn.ghost{background:none;color:var(--accent);}
.btn.danger{border-color:var(--miss);color:var(--miss);background:none;}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0;}
.opt{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-size:14px;}
.opt input{accent-color:var(--accent);width:16px;height:16px;margin:0;}
.opt.on{border-color:var(--accent);background:var(--soft);font-weight:600;}
.xl{display:grid;grid-template-columns:1fr auto auto;gap:6px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px;}
.xl .sub{font-size:12.5px;color:var(--ink2);}
.ncl{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);}
.ncl input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--ok);flex:none;}
.ncl .tt{font-weight:600;font-size:14.5px;}
.ncl .ss{font-size:12.5px;color:var(--ink2);}
textarea.inp{width:100%;min-height:90px;font-family:ui-monospace,Consolas,monospace;font-size:12px;}
ul.plain{margin:6px 0;padding-left:20px;} ul.plain li{margin:4px 0;font-size:14px;max-width:80ch;}
.foot{margin-top:24px;font-size:12.5px;color:var(--ink2);}

/* 남은 과목 화면 */
.rem-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px;}
.rem-sum .box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
.rem-sum .box.tot{border-color:var(--accent);border-width:2px;}
.rem-sum .k{font-size:13px;color:var(--ink2);font-weight:500;}
.rem-sum .v{font-size:30px;font-weight:700;line-height:1.2;letter-spacing:-0.02em;}
.rem-sum .v small{font-size:14px;font-weight:500;color:var(--ink2);margin-left:2px;}
.rem-sum .v.z{color:var(--ok);}
.rc-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;}
.rc-h h2{margin:0;font-size:19px;}
.rc-n{font-size:14px;color:var(--ink2);}
.rc-n b{font-size:26px;color:var(--miss);font-weight:700;margin:0 2px;}
.rc-n.z b{color:var(--ok);}
.rg{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;}
.rg-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:2px;}
.rg-h .t{font-weight:700;font-size:15.5px;}
.rg-h .s{font-size:13.5px;font-weight:600;color:var(--miss);}
.rr{display:grid;grid-template-columns:62px 1fr auto;gap:2px 12px;align-items:start;padding:9px 0;border-top:1px dashed var(--line);}
.rg-h + .rr{border-top:0;}
.rr .tg{display:inline-block;text-align:center;font-size:12px;font-weight:700;padding:2px 0;border-radius:6px;background:var(--soft);color:var(--ink2);}
.rr .tg.req{background:var(--missbg);color:var(--miss);}
.rr .tg.pk{background:var(--progbg);color:var(--prog);}
.rr .tg.ok{background:var(--okbg);color:var(--ok);}
.rr .nm{font-size:15px;font-weight:600;}
.rr .nt{font-size:12.5px;color:var(--ink2);margin-top:1px;}
.rr .cr{font-weight:700;font-size:15px;white-space:nowrap;text-align:right;}
.rr .cr.neg{color:var(--ok);}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
.chip{font-size:12px;padding:2px 9px;border-radius:12px;background:var(--soft);color:var(--ink2);border:1px solid var(--line);}
details.cand{margin-top:6px;}
details.cand>summary{cursor:pointer;font-size:12.5px;color:var(--accent);font-weight:600;}
.done-msg{padding:12px;border-radius:8px;background:var(--okbg);color:var(--ok);font-weight:600;font-size:14px;margin-top:10px;}
.tkpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;}
.tkpick .opt{width:100%;align-items:flex-start;}
.tkpick .opt small{display:block;font-weight:400;color:var(--ink2);font-size:12px;}
ul.bul{margin:6px 0 0;padding-left:20px;} ul.bul li{margin:3px 0;font-size:13.5px;}

.search{margin-top:14px;display:flex;gap:8px;align-items:center;}
.search input{flex:1;min-width:0;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:15.5px;color:var(--ink);}
.search input:focus-visible{border-color:var(--accent);}
.crs .cat{font-size:12px;color:var(--ink2);font-weight:400;margin-top:2px;}
.crs.s1 .nm .cat,.crs.s2 .nm .cat{color:var(--ink2);font-weight:400;}
mark{background:var(--progbg);color:var(--prog);border-radius:3px;padding:0 1px;}
.qf{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;}
.qf button{border:1px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:16px;font-size:13px;color:var(--ink2);}
.qf button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;}
.sh{font-size:13px;font-weight:700;color:var(--ink2);margin:14px 0 2px;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}

@media (max-width:640px){
  .lrow{grid-template-columns:1fr;gap:4px;}
  .lrow .rt{text-align:left;}
  .lg-top .n{font-size:46px;}
  .crs{grid-template-columns:1fr auto;}
  .crs .cr{display:none;}
  .crs .nm .c{font-size:12px;color:var(--ink2);margin-left:6px;}
  .xl{grid-template-columns:1fr auto;}
  .rr{grid-template-columns:52px 1fr auto;gap:2px 8px;}
}
@media (min-width:641px){ .crs .nm .c{display:none;} }
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>

function trackCalc(cnt,dept,otherReq){
  const t=TRK[S.tkId];if(!t)return null;
  let earned=0,missing=0,extra=0;const seen={};
  const reqRows=[],optLeft=[];
  const countExtra=function(o){if(seen[o.id])return;seen[o.id]=1;if(o.isTk||otherReq.indexOf(o.ref)>=0)extra+=o.cr;};
  t.rows.forEach(function(rw){
    if(rw.dept&&rw.dept!==dept)return;
    if(rw.pick){
      const done=rw.opts.filter(function(o){return cnt(o.id);});
      const left=rw.opts.filter(function(o){return !cnt(o.id);}).map(function(o){return {n:o.n,cr:o.cr};});
      done.slice(0,rw.pick).forEach(function(o){earned+=o.cr;countExtra(o);});
      const sh=Math.max(0,rw.pick-done.length);
      if(rw.req&&sh>0){
        const mc=Math.min.apply(null,rw.opts.map(function(o){return o.cr;}));
        missing+=sh*mc;
        reqRows.push({n:rw.label,cr:sh*mc,tag:'택'+rw.pick,note:sh+'과목 더 필요',opts:left});
      }else if(!rw.req&&sh>0){left.forEach(function(o){optLeft.push(o);});}
    }else{
      if(cnt(rw.id)){earned+=rw.cr;countExtra(rw);}
      else if(rw.req){missing+=rw.cr;reqRows.push({n:rw.n,cr:rw.cr,tag:'필수'});}
      else optLeft.push({n:rw.n,cr:rw.cr});
    }
  });
  const gap=Math.max(0,t.need-earned);
  const rem=Math.max(missing,gap);
  return {t:t,earned:earned,need:t.need,rem:rem,missing:missing,extraGap:Math.max(0,gap-missing),reqRows:reqRows,optLeft:optLeft,extra:extra};
}

function compute(S,inc){
  const ex=!!S.exchange;
  const cnt=function(id){const v=S.st[id]|0;return v===1||(inc&&v===2);};
  const sumIds=function(ids){return ids.reduce(function(a,id){return a+(cnt(id)?C[id].cr:0);},0);};
  const G={gy:[],ma:[],po:[],tk:[]};
  const grp=function(area,title){const g={t:title,rem:0,rows:[]};G[area].push(g);return g;};
  const row=function(g,n,cr,tag,extra){const o={n:n,cr:cr,tag:tag||''};if(extra)Object.assign(o,extra);g.rows.push(o);};
  const missOpts=function(ids){return ids.filter(function(id){return !cnt(id);}).map(function(id){return {n:C[id].name,cr:C[id].cr};});};

  /* 인정(외부) 학점 */
  const xs={};const codes={R:0,H:0,G:0};let used=0;
  S.extras.forEach(function(e){
    const v=e.status|0;if(!(v===1||(inc&&v===2)))return;
    let c=Math.max(0,+e.cr||0);
    if(e.exch&&ex){const room=Math.max(0,20-used);c=Math.min(c,room);used+=c;}
    xs[e.bucket]=(xs[e.bucket]||0)+c;
    if(e.code)codes[e.code]+=c;
  });
  const langC=(S.lang.d|0)+(inc?(S.lang.p|0):0);

  /* ---------- 교양 ---------- */
  const gyT=ex?35:38;
  const gBasic=grp('gy','기초교양'),gAdv=grp('gy','심화교양'),gHum=grp('gy','인성교양');
  let basicRem=0,advRem=0,humRem=0;
  const areaInfo={};
  AREAS.forEach(function(a){
    const reqMiss=a.req.reduce(function(s,id){return s+(cnt(id)?0:C[id].cr);},0);
    const selE=sumIds(a.sel)+(a.lang?langC:0)+(xs[a.xb]||0);
    const selMiss=Math.max(0,a.min-selE);
    areaInfo[a.k]={reqMiss:reqMiss,selE:selE,selMiss:selMiss,min:a.min};
    a.req.forEach(function(id){if(!cnt(id))row(a.grp==='기초교양'?gBasic:gAdv,C[id].name,C[id].cr,'필수');});
    if(a.grp==='기초교양')basicRem+=reqMiss+selMiss;
    else advRem+=reqMiss;
  });
  let selMissAdv=0;
  AREAS.forEach(function(a){
    const inf=areaInfo[a.k];
    if(a.grp==='심화교양')selMissAdv+=inf.selMiss;
    if(inf.selMiss>0){
      row(a.grp==='기초교양'?gBasic:gAdv,a.title+' 선택',inf.selMiss,'선택',{note:a.min+'학점 이상 필요',opts:a.lang?[{n:'외국어기초·심화, 대학영어 (각 1학점)'}]:missOpts(a.sel)});
    }
  });
  const waiver=ex?Math.min(2,selMissAdv):0;
  advRem+=Math.max(0,selMissAdv-waiver);
  if(waiver>0)row(gAdv,'교류수학 특례로 면제',-waiver,'특례',{note:'심화교양 2학점 면제(선택영역 부족분에서 차감)'});
  const humT=ex?9:10;
  const humE=sumIds([HUM_LEAD].concat(HUM_MUDO));
  humRem=Math.max(0,humT-humE);
  if(humRem>0){
    if(!cnt(HUM_LEAD))row(gHum,'리더십아카데미',2,'필수',{note:'3학년 2학기에 일괄 반영'});
    const need=humRem-(cnt(HUM_LEAD)?0:2);
    if(need>0)row(gHum,'무도',need,'필수',{note:'Ⅰ~Ⅷ 각 1학점'+(ex?' (특례로 1학점 면제된 기준)':''),opts:missOpts(HUM_MUDO)});
  }
  gBasic.rem=basicRem;gAdv.rem=advRem;gHum.rem=humRem;
  const gyRem=basicRem+advRem+humRem;

  /* ---------- 일반학전공 ---------- */
  const dept=S.track&&TR[S.track]?TR[S.track].dept:S.dept;
  const own=S.track;
  const gB=grp('ma','전공기초'),gR=grp('ma','전공필수'),gS=grp('ma','전공선택');
  const civOk=cnt(MA_CIV[0])||cnt(MA_CIV[1]);
  const maBaseMiss=MA_BASE.reduce(function(s,id){return s+(cnt(id)?0:C[id].cr);},0)+(civOk?0:3);
  MA_BASE.forEach(function(id){if(!cnt(id))row(gB,C[id].name,C[id].cr,'필수');});
  if(!civOk)row(gB,'경찰민법Ⅰ 또는 민법총칙',3,'택1',{opts:missOpts(MA_CIV)});
  const rq=REQ[dept];
  const rqPickOk=!rq.pick.length||rq.pick.some(cnt);
  const rqMiss=rq.fixed.reduce(function(s,id){return s+(cnt(id)?0:C[id].cr);},0)+(rqPickOk?0:3);
  rq.fixed.forEach(function(id){if(!cnt(id))row(gR,C[id].name,C[id].cr,'필수');});
  if(!rqPickOk)row(gR,rq.pickLabel.replace(' (택1)',''),3,'택1',{opts:missOpts(rq.pick)});
  gB.rem=maBaseMiss;gR.rem=rqMiss;

  /* 전공선택 */
  const T=ex?20:21;
  const adv=S.adv;
  const sameOther=Object.keys(TR).filter(function(k){return k!==own&&TR[k].dept===dept;})[0];
  const otherTracks=Object.keys(TR).filter(function(k){return TR[k].dept!==dept;});
  const trackIds=function(t){return LIST[t].map(function(_,i){return t+'_'+i;});};
  const trackC=function(t){return sumIds(trackIds(t));};
  const semC=function(t){return sumIds([t+'_s1',t+'_s2']);};
  const otherDept=dept==='law'?'admin':'law';
  const minorIds=REQ[otherDept].fixed.concat(REQ[otherDept].pick);
  const thC=sumIds(TH);
  const ownC=trackC(own)+semC(own)+thC+(xs.ma_own||0);
  const sameC=trackC(sameOther)+semC(sameOther)+(xs.ma_same||0);
  const otherC=otherTracks.reduce(function(a,t){return a+trackC(t)+semC(t);},0)+(adv==='minor'?sumIds(minorIds):0)+(xs.ma_other||0);

  /* 융복합트랙 */
  let tkr=null,tkExtra=0;
  if(adv==='track'&&S.tkId&&TRK[S.tkId]){
    tkr=trackCalc(cnt,dept,minorIds);
    tkExtra=tkr?tkr.extra:0;
  }
  const totalSel=ownC+sameC+otherC+tkExtra;
  const advDiff=adv==='major'&&S.advTrack!==own&&TR[S.advTrack]&&TR[S.advTrack].dept===dept;
  const advT=advDiff?S.advTrack:null;
  const advPoolC=advDiff?(S.advTrack===sameOther?sameC:0):0;
  const mSemOwn=(cnt(own+'_s1')?0:2)+(cnt(own+'_s2')?0:2);
  const mSemAdv=advDiff?((cnt(advT+'_s1')?0:2)+(cnt(advT+'_s2')?0:2)):0;
  const mTh=(cnt('th1')?0:1)+(cnt('th2')?0:1);
  const ownReq=(adv==='major'&&!advDiff)?20:8;
  const yOwn=Math.max(0,ownReq-ownC-mSemOwn-mTh);
  const yAdv=advDiff?Math.max(0,12-advPoolC-mSemAdv):0;
  const yOther=adv==='minor'?Math.max(0,12-otherC):0;
  const after=totalSel+mSemOwn+mSemAdv+mTh+yOwn+yAdv+yOther;
  const yAny=Math.max(0,T-after);
  const selRem=mSemOwn+mSemAdv+mTh+yOwn+yAdv+yOther+yAny;
  [1,2].forEach(function(n){if(!cnt(own+'_s'+n))row(gS,SEM_NAME[own]+' '+(n===1?'Ⅰ':'Ⅱ'),2,'필수',{note:'소속 전공과정 전공심화세미나'});});
  if(advDiff)[1,2].forEach(function(n){if(!cnt(advT+'_s'+n))row(gS,SEM_NAME[advT]+' '+(n===1?'Ⅰ':'Ⅱ'),2,'필수',{note:'심화전공 세미나'});});
  [['th1','Ⅰ'],['th2','Ⅱ']].forEach(function(x){if(!cnt(x[0]))row(gS,'논문활동 '+x[1],1,'졸업요건',{note:'4학년'});});
  if(yOwn>0)row(gS,'소속 전공과정('+TR[own].name+') 전공선택',yOwn,'선택',{note:ownReq===20?'심화전공: 8학점 + 심화 12학점':'소속 전공과정에서 8학점 이상 필요',opts:missOpts(trackIds(own))});
  if(yAdv>0)row(gS,'심화전공('+(advT?TR[advT].name:'')+') 전공선택',yAdv,'선택',{note:'심화 12학점',opts:missOpts(trackIds(advT))});
  if(yOther>0)row(gS,'부전공: 상대 학과 전공필수·전공선택',yOther,'선택',{note:'12학점 (전공기초 제외)',opts:missOpts(minorIds.concat(otherTracks.reduce(function(a,t){return a.concat(trackIds(t));},[])))});
  if(yAny>0)row(gS,'전공선택 (어느 전공과정이든 가능)',yAny,'선택',{note:'일반학전공 탭의 전공선택 목록에서 고르세요'});
  gS.rem=selRem;
  const maRem=maBaseMiss+rqMiss+selRem;
  const maT=ex?63:64;

  /* ---------- 경찰학전공 ---------- */
  const gb=grp('po','전공기초 (경찰 관계 형사법)'),gr=grp('po','경찰학필수'),ge=grp('po','경찰학선택');
  const poBaseMiss=PO_BASE.reduce(function(s,id){return s+(cnt(id)?0:C[id].cr);},0);
  PO_BASE.forEach(function(id){if(!cnt(id))row(gb,C[id].name,C[id].cr,'필수');});
  const poReqMiss=PO_REQ.reduce(function(s,id){return s+(cnt(id)?0:C[id].cr);},0);
  PO_REQ.forEach(function(id){if(!cnt(id))row(gr,C[id].name,C[id].cr,'필수');});
  const pickN=PO_PICK.filter(cnt).length;
  const pickMiss=Math.max(0,3-pickN)*2;
  if(pickMiss>0)row(gr,'4과목 중 3과목 이수',pickMiss,'택3',{note:(3-pickN)+'과목 더 필요',opts:missOpts(PO_PICK)});
  const poElecE=sumIds(PO_ELEC)+(xs.po_elec||0);
  const poElecMiss=Math.max(0,11-poElecE);
  if(poElecMiss>0)row(ge,'경찰학선택',poElecMiss,'선택',{note:'11학점 이상 필요',opts:missOpts(PO_ELEC)});
  gb.rem=poBaseMiss;gr.rem=poReqMiss+pickMiss;ge.rem=poElecMiss;
  const poRem=poBaseMiss+poReqMiss+pickMiss+poElecMiss;

  /* ---------- 융복합트랙 남은 과목 ---------- */
  if(tkr){
    const gt=grp('tk',tkr.t.name+' 트랙');
    tkr.reqRows.forEach(function(r){gt.rows.push(r);});
    if(tkr.extraGap>0)gt.rows.push({n:'지정 과목 중 추가 이수',cr:tkr.extraGap,tag:'선택',note:'트랙 학점 계 '+tkr.need+'학점 중 부족분',opts:tkr.optLeft});
    gt.rem=tkr.rem;
  }

  /* ---------- 부호지정 ---------- */
  const isCode=function(c,id){return C[id].tags.indexOf(c)>=0;};
  const codeSum=function(c){return Object.keys(C).reduce(function(a,id){return a+(cnt(id)&&isCode(c,id)?C[id].cr:0);},0)+codes[c];};
  const code={R:{need:ex?10:12,have:codeSum('R')},H:{need:2,have:codeSum('H')},G:{need:2,have:codeSum('G')}};

  const total=gyRem+maRem+poRem;
  const target=gyT+maT+38;
  return {inc:inc,ex:ex,exUsed:used,
    gy:{t:gyT,rem:gyRem,basic:basicRem,adv:advRem,hum:humRem,areas:areaInfo},
    ma:{t:maT,rem:maRem,base:maBaseMiss,req:rqMiss,sel:selRem,selT:T,own:ownC,ownReq:ownReq,total:totalSel,dept:dept},
    po:{t:38,rem:poRem},
    tk:tkr?{name:tkr.t.name,need:tkr.need,earned:tkr.earned,rem:tkr.rem}:null,
    total:total,target:target,G:G,code:code};
}

function ledgerRow(name,sub,d,i){
  const t=Math.max(1,d.t);
  const done=Math.max(0,t-d.rem),prog=Math.max(0,d.rem-i.rem);
  const pd=Math.min(100,done/t*100),pp=Math.min(100-pd,prog/t*100);

  const v=S.st[it.id]|0;
  const cat=it.cat+(it.mem?(it.cat?' · ':'')+it.mem:'');
  return '<div class="crs s'+v+'"><div class="nm">'+hl(it.name,q)+tagHtml({tags:it.tags})+'<span class="c">'+it.cr+'학점</span><div class="cat">'+esc(cat)+'</div></div><div class="cr num">'+it.cr+'학점</div>'+segHtml(it.id,v,it.name)+'</div>';
}
function langRow(){
  return '<div class="crs"><div class="nm">외국어 (외국어기초 Ⅰ~Ⅱ, 외국어심화 Ⅰ~Ⅳ, 대학영어 심화 Ⅰ~Ⅳ)<div class="cat">교양 · 기초교양 · 글로벌 역량 1 · 과목마다 1학점이라 교양 탭에서 학점 수로 입력합니다</div></div><div class="cr num">1학점</div><button class="btn ghost" type="button" data-act="tab" data-tab="gy">교양 탭으로 이동</button></div>';
}
function panelSearch(R){
  const q=Q,k=sn(q);
  const keep=function(it){return QF==='all'||String(S.st[it.id]|0)===QF;};
  const A=[],B=[];
  IDX.forEach(function(it){if(it.key.indexOf(k)>=0)A.push(it);else if(it.ckey.indexOf(k)>=0)B.push(it);});
  const A2=A.filter(keep),B2=B.filter(keep);
  const showLang=k.length>=2&&QF!=='1'&&QF!=='2'&&LANGKEYS.some(function(x){return x.indexOf(k)>=0||k.indexOf(x)>=0;});
  const LIMIT=100;
  const total=A2.length+B2.length;
  let h='<div class="card"><div class="rc-h"><h2>검색 결과 <span class="tg">“'+esc(q)+'”</span></h2><button class="btn ghost" type="button" data-act="qclear">검색 닫기</button></div>';
  h+='<div class="qf" role="group" aria-label="이수 상태로 거르기">'+[['all','전체'],['0','미이수'],['1','이수'],['2','수강 중']].map(function(o){return '<button type="button" data-act="qf" data-v="'+o[0]+'" aria-pressed="'+(QF===o[0])+'">'+o[1]+'</button>';}).join('')+'</div>';
  h+='<p class="note">과목명에서 '+A2.length+'개, 분류·융복합트랙 이름에서 '+B2.length+'개를 찾았습니다. 이수 상태 버튼을 누르면 바로 반영됩니다.'+(total>LIMIT?' 앞의 '+LIMIT+'개만 표시하니 더 구체적으로 입력해 보세요.':'')+'</p>';
  let shown=0;
  const part=function(list,title){
    if(!list.length||shown>=LIMIT)return;
    h+='<div class="sh">'+title+'</div>';
    list.forEach(function(it){if(shown>=LIMIT)return;shown++;h+=resRow(it,q);});
  };
  if(showLang)h+=langRow();
  part(A2,'과목명 일치');
  part(B2,'분류·융복합트랙 일치');
  if(!total&&!showLang)h+='<p class="note">'+(QF==='all'?'찾는 과목이 없습니다. 과목명 일부(예: 형법), 분류(예: 경찰학선택), 융복합트랙 이름(예: 사이버안전)으로 검색해 보세요.':'이 이수 상태에 해당하는 과목이 없습니다. 위에서 전체를 선택해 보세요.')+'</p>';
  return h+'</div>';
}

function renderPanels(R){
  const map={start:panelStart,gy:panelGy,ma:panelMa,po:panelPo,tk:panelTk,xt:panelXt,nc:panelNc,rem:panelRem};
  fixUi();
  if(Q){document.getElementById('panels').innerHTML=panelSearch(R);return;}
  const t=S.ui.tab;
  document.getElementById('panels').innerHTML='<div class="panel on" role="tabpanel">'+(map[t]||panelStart)(R)+'</div>';
}

function renderAll(){
  const R={d:compute(S,false),i:compute(S,true)};
  renderBar(R);renderHero(R);renderTabs(R);renderPanels(R);
}

/* ============================================================
   이벤트
   ============================================================ */
function clearQ(){Q='';QF='all';const q=document.getElementById('q');if(q)q.value='';}
function onInput(ev){const t=ev.target;if(t&&t.id==='q'){Q=t.value.trim();if(!Q)QF='all';renderAll();}}
function onKey(ev){if(ev.key==='Escape'&&Q){clearQ();renderAll();}}
function onClick(ev){
  const t=ev.target.closest('[data-act]');if(!t)return;
  const act=t.getAttribute('data-act');
  if(act==='st'){S.st[t.getAttribute('data-id')]=+t.getAttribute('data-v');}
  else if(act==='tab'){clearQ();S.ui.tab=t.getAttribute('data-tab');saveState();renderAll();window.scrollTo({top:0});return;}
  else if(act==='qclear'){clearQ();}
  else if(act==='qf'){QF=t.getAttribute('data-v');}
  else if(act==='lang'){const f=t.getAttribute('data-f');S.lang[f]=Math.max(0,Math.min(30,(S.lang[f]|0)+(+t.getAttribute('data-d'))));}
  else if(act==='addx'){
    const name=document.getElementById('x_name').value.trim();
    const cr=Math.max(0,Math.min(20,+document.getElementById('x_cr').value||0));
    if(!cr){document.getElementById('x_cr').focus();return;}
    const exEl=document.getElementById('x_exch');
    S.extras.push({id:S.nid++,name:name,cr:cr,bucket:document.getElementById('x_bucket').value,code:document.getElementById('x_code').value,status:+document.getElementById('x_status').value,exch:exEl?exEl.checked:false});
  }
  else if(act==='xst'){const e=S.extras.filter(function(x){return x.id==t.getAttribute('data-id');})[0];if(e)e.status=+t.getAttribute('data-v');}
  else if(act==='delx'){S.extras=S.extras.filter(function(x){return x.id!=t.getAttribute('data-id');});}
  else if(act==='nc'){S.nc[t.getAttribute('data-k')]=t.checked;}
  else if(act==='inc'){S.inc=t.checked;}
  else if(act==='export'){document.getElementById('bk').value=JSON.stringify(S);return;}
  else if(act==='import'){
    try{const o=JSON.parse(document.getElementById('bk').value);S=Object.assign(defState(),o);S.ui=Object.assign({tab:'start',open:{}},o.ui||{});}
    catch(e){alert('불러오지 못했습니다. 내보내기로 만든 내용을 그대로 붙여넣어 주세요.');return;}
  }
  else if(act==='reset'){if(!confirm('입력한 내용을 모두 지울까요?'))return;S=defState();}
  saveState();renderAll();
}
function onChange(ev){
  const t=ev.target;const k=t.getAttribute&&t.getAttribute('data-set');
  if(!k)return;
  if(k==='dept'){S.deptSet=true;const d=t.value;const first=Object.keys(TR).filter(function(x){return TR[x].dept===d;})[0];if(TR[S.track].dept!==d){S.track=first;}S.advTrack=S.track;}
  else if(k==='track'){S.deptSet=true;S.track=t.value;S.advTrack=t.value;}
  else if(k==='adv'){S.adv=t.value;if(S.adv==='major')S.advTrack=S.track;}
  else if(k==='advTrack'){S.advTrack=t.value;}
  else if(k==='tkId'){S.tkId=t.value;}
  else if(k==='exchange'){S.exchange=t.checked;}
  else if(k==='sem'){S.sem=Math.max(1,Math.min(8,+t.value||1));}
  else if(k==='vol'||k==='warn'||k==='xch'||k==='trackDone'){S[k]=Math.max(0,+t.value||0);}
  saveState();renderAll();
}
function onToggle(ev){
  const d=ev.target;
  if(d&&d.tagName==='DETAILS'&&d.getAttribute('data-k')){S.ui.open[d.getAttribute('data-k')]=d.open;saveState();}
}
function boot(){
  loadState();
  if(!TR[S.track])S.track='LAPL';
  document.addEventListener('click',onClick);
  document.addEventListener('change',onChange);
  document.addEventListener('toggle',onToggle,true);
  document.addEventListener('input',onInput);
  document.addEventListener('keydown',onKey);
  renderAll();
}
if(typeof document!=='undefined'&&document.getElementById('panels'))boot();
</script>
